[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:hyperhdr]
command=/usr/bin/hyperhdr --userdata /config --service
user=hyperhdr
environment=HOME="/config",QT_QPA_PLATFORM="offscreen"
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:source-bridge-control]
command=python3 /opt/hypertizen/source_bridge_control.py --listen 0.0.0.0 --plex-url http://192.168.10.10:32400 --tv-model QE77S95FATXXH --hyperhdr-host 127.0.0.1 --hyperhdr-port 19400 --sync-lead 1.5 --hardware-decoder vaapi --plex-path-prefix /data --local-media-root /media --log /state/source-bridge.log
user=root
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
