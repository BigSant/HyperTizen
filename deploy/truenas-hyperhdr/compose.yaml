name: hypertizen-hyperhdr

services:
  hyperhdr:
    image: ghcr.io/bigsant/hypertizen-hyperhdr:sha-7d4f0ab
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      TZ: Europe/Vilnius
    ports:
      - "8091:8090"
      - "8093:8092"
      - "19401:19400"
      - "19446:19444"
      - "19545:19445"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/Vault/apps/hypertizen-hyperhdr/config:/config
      - /mnt/Vault/apps/hypertizen-hyperhdr/bridge-state:/state
      - /mnt/Vault/Media:/media:ro
    security_opt:
      - no-new-privileges:true
