<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HyperTizen</title>
<link rel="stylesheet" href="main.css">
<script src="js/wsClient.js"></script>
<script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
</head>

<body>
    <div class="content">
        <h1>HyperTizen (custom)</h1>
        <hr>
        <div id="console"></div>
        
        <h3 id="status">Status</h3>
        <a><input type="checkbox" id="enabled"> Enabled</a>
        
        <h2 id="ssdpDeviceTitle">SSDP Devices</h2>
        <div id="ssdpItems"></div>
    </div>
</body>

<script>
    window.onload = function () {
        updateStatus('Starting');
    
        let elements = document.querySelectorAll('button, input, [tabindex]');
        let elementsArray = Array.prototype.slice.call(elements);
        let focusedElement = document.activeElement;
        let focusedIndex = elementsArray.indexOf(focusedElement);

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (focusedIndex < elementsArray.length - 1) {
                    elementsArray[focusedIndex + 1].focus();
                    focusedIndex++;
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (focusedIndex > 0) {
                    elementsArray[focusedIndex - 1].focus();
                    focusedIndex--;
                }
            } else if (e.key == 'Enter') {
                e.preventDefault();
                const element = elementsArray[focusedIndex];
                element.click();
                if (element.classList.contains('ssdpItem')) {
                    const uri = element.getAttribute('data-uri');
                    updateStatus('setRPC triggered');
                    setRPC(uri);
                }
            }
        });

        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.addedNodes.length > 0) {
                    elements = document.querySelectorAll('button, input, [tabindex]');
                    elementsArray = Array.prototype.slice.call(elements);
                    focusedIndex = elementsArray.indexOf(document.activeElement);
                }
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        updateStatus('Sending request to http://127.0.0.1:8081');
        fetch('http://127.0.0.1:8081')
            .then(res => res.text())
            .then(ip => {
                updateStatus('Success, IP: '+ ip);
                
                deviceIP = ip;

                const testWS = new WebSocket(`ws://${ip}:8086`);
                updateStatus('Testing websocket: `ws://${ip}:8086`');

                testWS.onopen = function () {
                    updateStatus('OnOpen triggered');
                    testWS.close();
                    open();
                };
                
                testWS.onerror = function () {
                    updateStatus('OnError triggered');
                    location.reload();
                };
            })
            .catch(error => {
                updateStatus('Error: ' + error.stack);    
                console.error(error);
            })
        ;   
    };
</script>

</html>
