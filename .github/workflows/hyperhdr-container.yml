name: HyperHDR TrueNAS container

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/hyperhdr-container.yml
      - deploy/truenas-hyperhdr/**
      - tools/source_bridge.py
      - tools/source_bridge_control.py
      - tools/requirements.txt

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/hypertizen-hyperhdr
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/truenas-hyperhdr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
