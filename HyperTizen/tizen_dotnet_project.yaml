# csproj file path
csproj_file: HyperTizen.csproj

# Default profile, Tizen API version
profile: tizen
api_version: "10.0"

# Build type [Debug/ Release/ Test]
build_type: Debug

# Output path for build
output_path: ""

# Signing profile to be used for Tizen package signing
# If value is empty: "", active signing profile will be used
# Else If value is ".", default signing profile will be used
signing_profile: ""

# files monitored for dirty/modified status
files:
  - .gitattributes
  - Capture/CaptureMethodSelector.cs
  - Capture/CaptureResult.cs
  - Capture/ICaptureMethod.cs
  - Capture/PixelSamplingCaptureV2Method.cs
  - Capture/PixelSamplingCaptureMethod.cs
  - Capture/T7SdkCaptureMethod.cs
  - Capture/T8SdkCaptureMethod.cs
  - Capture/T9DisplayCaptureMethod.cs
  - Capture/T9VideoCaptureMethod.cs
  - DiagnosticCapture.cs
  - Directory.Build.targets
  - Flatbuffers/Clear.cs
  - Flatbuffers/Color.cs
  - Flatbuffers/Command.cs
  - Flatbuffers/Image.cs
  - Flatbuffers/ImageType.cs
  - Flatbuffers/NV12Image.cs
  - Flatbuffers/RawImage.cs
  - Flatbuffers/Register.cs
  - Flatbuffers/Reply.cs
  - Flatbuffers/Request.cs
  - Globals.cs
  - Helper/Log.cs
  - Helper/SsdpDiscovery.cs
  - HyperTizen.csproj
  - HyperTizen.csproj.user
  - HyperTizen_App.cs
  - HyperionClient.cs
  - LogWebSocketServer.cs
  - Networking.cs
  - SDK/Filestealer.cs
  - SDK/SystemInfo.cs
  - WebSocket/DataTypes.cs
  - WebSocket/WebSocket.cs
  - shared/res/HyperTizen.png
  - shared/res/HyperTizen.png
  - tizen-manifest.xml

# project dependencies
deps: []
